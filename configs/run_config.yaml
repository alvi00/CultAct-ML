# CultAct-ML Stage 3 run config - source of truth (PROJECT.md sec 5, 7, 9).
# No magic numbers in code; agent.py / run_grid.py read everything from here.

gateway:
  base_url_env: CRAFTX_BASE_URL      # never hardcode; read from environment / .env
  api_key_env: CRAFTX_API_KEY

models:
  - role: open                                   # pilot uses THIS one only
    id: "CraftX Qwen2.5 72B Instruct"
    short: qwen2572b
  - role: frontier
    id: "Kimi K2 Instruct"
    short: kimik2
  - role: reasoning
    id: "CraftX Qwen3 235B A22B Thinking 2507"
    short: qwen3think

decoding:
  temperature: 0.7
  # Uniform ceilings held constant across all models/languages. Raised from
  # 1024/3000 after the probe: the gateway did NOT enforce max_tokens (Qwen3-Thinking
  # ran plans to ~2313 completion tokens past 1024 without truncating), so these are
  # INSURANCE in case another model/config does enforce - not a behavioural knob.
  # Observed bn maxima were plan 2313 / act 2834; these sit well above with headroom.
  max_tokens_plan: 4096
  max_tokens_act: 6144

languages: [en, id, bn]
repeats: 3
retry_max: 2

rotation:
  scheme: latin_square_4
  seed: 42
  matrix: [[1, 0, 2, 3], [0, 3, 1, 2], [2, 1, 3, 0], [3, 2, 0, 1]]

paths:
  scenarios_en: data/scenarios_en.jsonl
  scenarios_id: data/scenarios_id.jsonl
  scenarios_bn: data/scenarios_bn.jsonl
  meta: data/scenarios_meta.jsonl
  runs_out: results/runs.jsonl
  raw_dir: results/raw

pilot:
  scenario_ids: [ca_001, ca_002, ca_003, ca_004, ca_005]
  model_role: open

# --probe: reasoning-model diagnostic before the full grid (measure token/truncation
# behaviour on the worst case = Bengali). 3 scenarios x [en, bn] x 1 repeat = 6 runs.
probe:
  scenario_ids: [ca_001, ca_002, ca_003]
  model_role: reasoning
  languages: [en, bn]        # skip id: bn is the worst case for tokens
  repeats: 1
